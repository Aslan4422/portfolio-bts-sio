# Vérifications automatiques (« intégration continue ») :
# à chaque envoi de code sur la branche main, et pour chaque proposition de modification
# (pull request), GitHub installe le projet sur une machine neuve et lance les mêmes
# vérifications qu'en local. Résultat : une coche verte ou une croix rouge sur GitHub.
name: Vérifications

on:
  push:
    branches: [main]
  pull_request:

# Droits minimaux : le robot peut seulement lire le code, rien modifier.
permissions:
  contents: read

# Si un nouvel envoi arrive pendant une vérification, l'ancienne est annulée.
concurrency:
  group: verifications-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verifier:
    name: Lint, types, tests et build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Récupérer le code
        uses: actions/checkout@v7
        with:
          # Le jeton d'accès n'est pas conservé sur la machine après la récupération.
          persist-credentials: false

      - name: Installer Node.js 24
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Installer les dépendances (versions exactes du package-lock.json)
        run: npm ci

      - name: Vérifier le code (ESLint)
        run: npm run lint

      - name: Vérifier les types (TypeScript)
        run: npm run typecheck

      - name: Lancer les tests (Vitest)
        run: npm test

      - name: Construire le site (comme Vercel)
        run: npm run build
